name: Test and package desktop app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_arm64:
        description: Build on an available self-hosted Windows ARM64 runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run prepare:tools -- ${{ matrix.platform }} ${{ matrix.arch }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: ytb-dl-ui-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
            resources/*/manifest.json
  windows-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_arm64
    runs-on: [self-hosted, Windows, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          architecture: arm64
          cache: npm
      - run: npm ci
      - run: npm run prepare:tools -- win arm64
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run package
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: ytb-dl-ui-win-arm64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            resources/win-arm64/manifest.json
